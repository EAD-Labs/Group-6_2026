name: Public health samples

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Sample canonical public health endpoints
        run: node scripts/probe-availability.ts artifacts/operations/availability.json
      - name: Retain safe public sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-${{ github.run_id }}
          path: artifacts/operations/availability.json
          retention-days: 90
          if-no-files-found: warn
